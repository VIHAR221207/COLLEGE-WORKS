<!DOCTYPE html>
<html>
<head>
    <title>Servlets</title>
</head>
<body>
    <h2>Generic Servlet</h2>
    <form action="GenericServletDemo" method="get">
        Name: <input type="text" name="username">
        <input type="submit" value="Submit">
    </form>

    <h2>HTTP Servlet</h2>
    <form action="HttpServletDemo" method="post">
        Name: <input type="text" name="username">
        <input type="submit" value="Submit">
    </form>
</body>
</html>
